<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Journal — SIVA TIME</title><link rel="stylesheet" href="styles.css"><style>.article-shell{max-width:850px;margin:10vh auto;padding:24px}.article-shell h1{font:clamp(36px,7vw,64px)/1.1 Georgia,serif}.article-shell .body{white-space:pre-wrap;color:#c6ccd6;line-height:1.9;font-size:17px}.article-shell a{color:#d9ad61}.article-shell .eyebrow{color:#56bfff;font:12px monospace;letter-spacing:.15em}</style></head><body><main class="article-shell"><a href="/#journal">← Back to journal</a><p class="eyebrow" id="category">SIVA TIME / JOURNAL</p><h1 id="title">Loading article…</h1><p id="date"></p><div class="body" id="body"></div><p id="error"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async()=>{const cfg=window.SIVA_CONFIG||{};const slug=new URLSearchParams(location.search).get('slug');if(!slug){document.getElementById('error').textContent='Article not found.';return;}if(!window.supabase||!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('YOUR_PROJECT')){document.getElementById('error').textContent='The journal is not configured yet.';return;}const db=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await db.from('articles').select('title,category,content,published_at').eq('slug',slug).eq('published',true).maybeSingle();if(error||!data){document.getElementById('error').textContent='This article is unavailable.';return;}document.title=data.title+' — SIVA TIME';document.getElementById('title').textContent=data.title;document.getElementById('category').textContent=data.category;document.getElementById('body').textContent=data.content||'Article content coming soon.';document.getElementById('date').textContent=data.published_at?new Date(data.published_at).toLocaleDateString():'';})();
</script></body></html>
